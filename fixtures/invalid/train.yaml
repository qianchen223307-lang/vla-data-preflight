run_id: synthetic_preflight
seed: 42
framework:
  name: QwenOFT
  action_model:
    action_dim: 7
    state_dim: 8
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: dataset
    data_mix: libero_all
    include_state: false
    per_device_batch_size: 2
trainer:
  max_train_steps: 100
  num_warmup_steps: 100
  gradient_accumulation_steps: 1
  learning_rate:
    base: 2.5e-05
